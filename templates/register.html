{% extends "base.html" %}
{% block title %}Become a donor{% endblock %}
{% block content %}
<h1>Become a donor</h1>
<p class="lead">We check your eligibility from the details below. Your phone number is only used for emergency matches.</p>
<form class="card" method="post">
  <div class="row">
    <div><label>Full name</label><input name="name" required></div>
    <div><label>Phone</label><input name="phone" required></div>
    <div><label>Email</label><input type="email" name="email" required></div>
    <div><label>Password</label><input type="password" name="password" minlength="6" required></div>
    <div><label>Blood group</label><select name="blood_group">{% for b in BLOOD_GROUPS %}<option>{{ b }}</option>{% endfor %}</select></div>
    <div><label>District</label><input name="district" required placeholder="e.g. Kailali"></div>
    <div><label>Age</label><input type="number" name="age" min="1" max="100" required></div>
    <div><label>Weight (kg)</label><input type="number" step="0.1" name="weight" required></div>
    <div><label>Hemoglobin (g/dL)</label><input type="number" step="0.1" name="hemoglobin" required></div>
    <div><label>Last donation (leave empty if never)</label><input type="date" name="last_donation" max="{{ today }}"></div>
  </div>
  <button>Register</button>
</form>
{% endblock %}
